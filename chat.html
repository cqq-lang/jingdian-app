<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜点 - 橘点点</title>
<link rel="stylesheet" href="assets/common.css">
<style>
  .chat-page {
    background: #F5F2ED;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  /* 顶部导航栏 */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 56px 12px 12px;
    background: #F5F2ED;
    position: relative;
    z-index: 10;
  }
  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-back-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .chat-header-center {
    display: flex;
    align-items: center;
    gap: 10px;
    position: absolute;
    left: 50%;
    transform: translateX(calc(-50% - 88px));
  }
  .chat-header-avatar {
    position: relative;
    width: 32px;
    height: 32px;
  }
  .chat-header-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .chat-user-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chat-username-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chat-username {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .chat-online-status {
    font-size: 13px;
    color: #9A958D;
  }
  .chat-header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .chat-icon-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  /* 聊天消息区域 */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .chat-msg {
    display: flex;
    gap: 8px;
    max-width: 100%;
  }
  .chat-msg.other {
    justify-content: flex-start;
  }
  .chat-msg.self {
    justify-content: flex-start;
    flex-direction: row-reverse;
    align-items: flex-start;
  }
  .chat-msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
  }
  .chat-msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .chat-msg.self .chat-msg-avatar {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-msg.self .chat-msg-avatar img {
    width: 90%;
    height: 90%;
    object-fit: contain;
  }
  .chat-msg-bubble {
    max-width: 240px;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
  }
  .chat-msg.other .chat-msg-bubble {
    background: #fff;
    color: #1a1a1a;
    border-top-left-radius: 4px;
  }
  .chat-msg.self .chat-msg-bubble {
    background: #FFAC5D;
    color: #fff;
    border-top-right-radius: 4px;
  }
  .chat-msg-time {
    text-align: center;
    font-size: 12px;
    color: #9A958D;
    margin: 4px 0;
  }
  /* 底部输入栏 */
  .chat-input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 8px;
    background: #F5F2ED;
  }
  .chat-voice-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    height: 40px;
    background: #fff;
    border-radius: 12px;
    border: none;
    outline: none;
    padding: 0 14px;
    font-size: 14px;
    color: #1a1a1a;
  }
  .chat-input::placeholder {
    color: #9A958D;
  }
  .chat-emoji-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .chat-add-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .chat-home-indicator {
    width: 134px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
    margin: 0 auto 8px;
  }

  .chat-header-online-dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 12px;
    height: 12px;
    background: #FF820C;
    border-radius: 50%;
    border: 2px solid #F5F2ED;
  }
</style>
</head>
<body>
  <div class="phone">
  <div class="chat-page">
    <!-- 顶部导航栏 -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-back-btn" onclick="goBack('msg')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M15 18l-6-6 6-6" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="chat-header-center">
        <div class="chat-header-avatar">
          <img src="assets/avatar4.png" alt="橘点点">
          <div class="chat-header-online-dot"></div>
        </div>
        <div class="chat-user-info">
          <div class="chat-username-row">
            <span class="chat-username">橘点点</span>
          </div>
          <span class="chat-online-status">在线</span>
        </div>
      </div>
      <div class="chat-header-right">
        <div class="chat-icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="5" r="1.8" fill="#1a1a1a"/>
            <circle cx="12" cy="12" r="1.8" fill="#1a1a1a"/>
            <circle cx="12" cy="19" r="1.8" fill="#1a1a1a"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 聊天消息区域 -->
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg-time">上午 10:15</div>

      <div class="chat-msg other">
        <div class="chat-msg-avatar">
          <img src="assets/avatar4.png" alt="橘点点">
        </div>
        <div class="chat-msg-bubble">你好！看你发的晓霞弄笔记，拍得真好看✨</div>
      </div>

      <div class="chat-msg self">
        <div class="chat-msg-avatar">
          <img src="assets/diandian.png" alt="点点">
        </div>
        <div class="chat-msg-bubble">谢谢！那边光线确实很有感觉</div>
      </div>

      <div class="chat-msg other">
        <div class="chat-msg-avatar">
          <img src="assets/avatar4.png" alt="橘点点">
        </div>
        <div class="chat-msg-bubble">请问你是几点去拍的呀？我上次下午去感觉光太硬了</div>
      </div>

      <div class="chat-msg self">
        <div class="chat-msg-avatar">
          <img src="assets/diandian.png" alt="点点">
        </div>
        <div class="chat-msg-bubble">我是傍晚5点左右到的，夕阳斜射进来特别美</div>
      </div>

      <div class="chat-msg other">
        <div class="chat-msg-avatar">
          <img src="assets/avatar4.png" alt="橘点点">
        </div>
        <div class="chat-msg-bubble">建议带个小补光，环境光偏暗</div>
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="chat-input-bar">
      <div class="chat-voice-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
          <path d="M10 8v8M14 6v12M7 10v4M17 10v4" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <input type="text" class="chat-input" placeholder="说点什么..." id="chatInput">
      <div class="chat-emoji-btn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="9" cy="10" r="1.2" fill="#1a1a1a"/>
          <circle cx="15" cy="10" r="1.2" fill="#1a1a1a"/>
        </svg>
      </div>
      <div class="chat-add-btn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#1a1a1a" stroke-width="1.5"/>
          <path d="M12 8v8M8 12h8" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="chat-home-indicator"></div>
  </div>

  <!-- 状态栏（固定顶部） -->
  <div class="status-bar status-bar-fixed" style="background: #F5F2ED;">
    <span class="status-time">9:00</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1a1a1a"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.5" fill="#1a1a1a"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1a1a1a"/><rect x="15" y="0.5" width="3" height="11.5" rx="0.5" fill="#1a1a1a"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#1a1a1a"/><path d="M3.5 6.2a6.4 6.4 0 019 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M1 3.5a10 10 0 0114 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1a1a1a" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1a1a1a"/><rect x="24" y="3.5" width="1.5" height="5" rx="0.75" fill="#1a1a1a" opacity="0.4"/></svg>
    </div>
  </div>
  </div>

<script src="assets/common.js"></script>
<script>
  // 发送消息
  function sendChatMessage() {
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return;

    var messages = document.getElementById('chatMessages');

    // 添加自己的消息
    var msgDiv = document.createElement('div');
    msgDiv.className = 'chat-msg self';
    msgDiv.innerHTML = '<div class="chat-msg-avatar"><img src="assets/diandian.png" alt="点点"></div><div class="chat-msg-bubble">' + text + '</div>';
    messages.appendChild(msgDiv);

    input.value = '';
    messages.scrollTop = messages.scrollHeight;

    // 模拟对方回复
    setTimeout(function() {
      var replyDiv = document.createElement('div');
      replyDiv.className = 'chat-msg other';
      replyDiv.innerHTML = '<div class="chat-msg-avatar"><img src="assets/avatar4.png" alt="橘点点"></div><div class="chat-msg-bubble">好的，收到！</div>';
      messages.appendChild(replyDiv);
      messages.scrollTop = messages.scrollHeight;
    }, 800);
  }

  // 回车发送
  document.getElementById('chatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      sendChatMessage();
    }
  });

  // 页面加载时显示状态栏并滚动到底部
  window.addEventListener('load', function() {
    var sb = document.querySelector('.status-bar-fixed');
    if (sb) sb.classList.add('show');
    var messages = document.getElementById('chatMessages');
    messages.scrollTop = messages.scrollHeight;
  });
</script>
</body>
</html>
