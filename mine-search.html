<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜点 - 搜索</title>
<link rel="stylesheet" href="assets/common.css">
<style>
  .mine-search-page {
    background: #F5F2ED;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .mine-search-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 54px 8px 16px 8px;
    background: #F5F2ED;
  }
  .mine-search-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .mine-search-input-wrap svg {
    flex-shrink: 0;
  }
  .mine-search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    color: #1a1a1a;
    background: transparent;
  }
  .mine-search-input::placeholder {
    color: #999;
  }
  .mine-search-cancel {
    font-size: 16px;
    color: #1a1a1a;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mine-search-content {
    flex: 1;
    padding: 20px 16px;
  }
  .mine-search-empty {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-top: 60px;
  }
  .mine-keyboard {
    width: 100%;
    flex-shrink: 0;
    animation: slideUp 0.3s ease-out;
  }
  .mine-keyboard img {
    width: 100%;
    display: block;
  }
  @keyframes slideUp {
    from {
      transform: translateY(100%);
    }
    to {
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <div class="phone">
  <div id="mine-search-view" class="view mine-search-page">
    <div class="mine-search-top">
      <div class="mine-search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="#999" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M21 21l-4.35-4.35" stroke="#999" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" class="mine-search-input" placeholder="搜索主页或全网内容" autofocus>
      </div>
      <div class="mine-search-cancel" onclick="goBack('mine')">取消</div>
    </div>
    
    <div class="mine-search-content">
    </div>
    <!-- 模拟键盘 -->
    <div class="mine-keyboard">
      <img src="assets/keyboard.png" alt="键盘">
    </div>
  </div>

  <!-- 状态栏（固定顶部） -->
  <div class="status-bar status-bar-fixed">
    <span class="status-time">9:00</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1a1a1a"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.5" fill="#1a1a1a"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1a1a1a"/><rect x="15" y="0.5" width="3" height="11.5" rx="0.5" fill="#1a1a1a"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#1a1a1a"/><path d="M3.5 6.2a6.4 6.4 0 019 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M1 3.5a10 10 0 0114 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1a1a1a" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1a1a1a"/><rect x="24" y="3.5" width="1.5" height="5" rx="0.75" fill="#1a1a1a" opacity="0.4"/></svg>
    </div>
  </div>
  </div>
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  <script src="assets/common.js"></script>
  <script>
    (function() {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      var current = document.getElementById('mine-search-view');
      if (current) current.classList.add('active');
      var sb = document.querySelector('.status-bar-fixed');
      if (sb) {
        sb.classList.add('show');
        // 设置状态栏背景色为#F5F2ED，和页面内容背景色一致
        sb.style.background = '#F5F2ED';
      }
    })();
  </script>
</body>
</html>
