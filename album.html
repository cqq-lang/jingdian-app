<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    /* 相册页面样式 */
    .album-page {
      width: 375px;
      height: 812px;
      background: #F5F2ED;
      border-radius: 40px;
      border: 8px solid #1a1a1a;
      overflow: hidden;
      position: relative;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    .album-header {
      height: 48px;
      background: #F5F2ED;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      border-bottom: none;
    }

    .album-back-btn {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .album-back-btn svg {
      width: 24px;
      height: 24px;
    }

    .album-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
    }

    /* 相册内容区域 */
    .album-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 100px 16px;
      scrollbar-width: none;
    }

    .album-content::-webkit-scrollbar {
      display: none;
    }

    /* 图片网格 */
    .album-grid {
      display: grid;
      grid-template-columns: 168px 168px;
      gap: 6px;
      justify-content: center;
    }

    .album-grid-item {
      width: 168px;
      height: 190px;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .album-grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body style="background: #f0f0f0; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

  <div class="album-page">
    <!-- 状态栏 -->
    <div class="status-bar" style="background: #F5F2ED;">
      <span class="status-time">9:00</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1a1a1a"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.5" fill="#1a1a1a"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1a1a1a"/><rect x="15" y="0.5" width="3" height="11.5" rx="0.5" fill="#1a1a1a"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#1a1a1a"/><path d="M3.5 6.2a6.4 6.4 0 019 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M1 3.5a10 10 0 0114 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1a1a1a" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1a1a1a"/><rect x="24" y="3.5" width="1.5" height="5" rx="0.75" fill="#1a1a1a" opacity="0.4"/></svg>
      </div>
    </div>

    <!-- 顶部导航栏 -->
    <div class="album-header">
      <div class="album-back-btn" onclick="goBack('place-detail')">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="album-title">相册</div>
    </div>

    <!-- 相册内容区域 -->
    <div class="album-content">
      <div class="album-grid">
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=1')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_1.jpg" alt="晓霞弄照片1"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=2')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_2.jpg" alt="晓霞弄照片2"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=3')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_3.jpg" alt="晓霞弄照片3"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=4')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_4.jpg" alt="晓霞弄照片4"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=5')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_5.jpg" alt="晓霞弄照片5"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=6')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_6.jpg" alt="晓霞弄照片6"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=7')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_7.jpg" alt="晓霞弄照片7"></div>
        <div class="album-grid-item" onclick="goUrl('photo-detail.html?index=8')" style="cursor: pointer;"><img src="assets/xiaoxianong_album_8.jpg" alt="晓霞弄照片8"></div>
      </div>
    </div>
  </div>

  <script src="assets/common.js"></script>
</body>
</html>
