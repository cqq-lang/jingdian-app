<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导航</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .nav-page {
      width: 375px;
      height: 812px;
      border-radius: 40px;
      border: 8px solid #1a1a1a;
      overflow: hidden;
      position: relative;
      margin: 20px auto;
      box-sizing: content-box;
    }

    /* 地图背景 */
    .map-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/map-bg.png');
      background-size: cover;
      background-position: center;
    }

    /* 状态栏 */
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    .status-bar .status-time {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .status-bar .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 返回按钮 */
    .back-btn {
      position: absolute;
      top: 60px;
      left: 8px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
    }

    /* 地图标签 */
    .map-label {
      position: absolute;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .map-label-text {
      background: #fff;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      border: 1px solid #ccc;
      white-space: nowrap;
      line-height: 1.4;
    }
    .map-label-marker {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-top: -6px;
      border: 2px solid #fff;
    }
    .map-label-marker.start {
      background: #4A90D9;
    }
    .map-label-marker.end {
      background: #FF820C;
    }

    /* 定位按钮 */
    .location-btn {
      position: absolute;
      bottom: 327px;
      right: 16px;
      width: 44px;
      height: 44px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .location-btn svg {
      width: 24px;
      height: 24px;
    }

    /* 底部信息区域 */
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 30px;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
    }

    /* 起点终点 */
    .route-inputs {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
    }

    .route-markers {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding-top: 4px;
    }

    .marker-start {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #4A90D9;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .marker-line {
      width: 2px;
      height: 20px;
      background: #e0e0e0;
    }

    .marker-end {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #FF820C;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .route-fields {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .route-field {
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 16px;
      color: #1a1a1a;
    }

    .route-field.start {
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      color: #999;
    }

    .route-field.end {
      color: #1a1a1a;
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .swap-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 20px;
    }

    .swap-btn svg {
      width: 24px;
      height: 24px;
    }

    /* 交通方式 */
    .transport-options {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .transport-option {
      width: 78px;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1.5px solid transparent;
    }

    .transport-option.active {
      background: rgba(255, 130, 12, 0.1);
      border: 1.5px solid #FF820C;
    }

    .transport-option .transport-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .transport-option .time {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .transport-option:not(.active) .time {
      color: #666;
      font-weight: 500;
    }

    /* 分割线 */
    .divider {
      height: 1px;
      background: #e8e8e8;
      margin-bottom: 20px;
    }

    /* 底部按钮 */
    .bottom-buttons {
      display: flex;
      gap: 12px;
    }

    .collect-btn {
      flex: 1;
      height: 48px;
      border: 1.5px solid #d0d0d0;
      border-radius: 24px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
      cursor: pointer;
    }

    .collect-btn svg {
      width: 22px;
      height: 22px;
    }

    .start-nav-btn {
      flex: 2;
      height: 48px;
      border: none;
      border-radius: 24px;
      background: #FF820C;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    .start-nav-btn svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>
  <div class="nav-page">
    <!-- 地图背景 -->
    <div class="map-bg"></div>

    <!-- 起点标签 -->
    <div class="map-label" style="top: 276px; right: 8px;">
      <div class="map-label-text">我的位置</div>
      <div class="map-label-marker start">起</div>
    </div>

    <!-- 终点标签 -->
    <div class="map-label" style="top: 340px; left: 50px;">
      <div class="map-label-text">晓霞弄</div>
      <div class="map-label-marker end">终</div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="status-time">9:00</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1a1a1a"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.5" fill="#1a1a1a"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1a1a1a"/><rect x="15" y="0.5" width="3" height="11.5" rx="0.5" fill="#1a1a1a"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#1a1a1a"/><path d="M3.5 6.2a6.4 6.4 0 019 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M1 3.5a10 10 0 0114 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1a1a1a" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1a1a1a"/><rect x="24" y="3.5" width="1.5" height="5" rx="0.75" fill="#1a1a1a" opacity="0.4"/></svg>
      </div>
    </div>

    <!-- 返回按钮 -->
    <div class="back-btn" onclick="goBack('spot-detail')">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- 定位按钮 -->
    <div class="location-btn">
      <img src="assets/location-icon.png" alt="定位" style="width: 24px; height: 24px; object-fit: contain;">
    </div>

    <!-- 底部信息区域 -->
    <div class="bottom-panel">
      <!-- 起点终点 -->
      <div class="route-inputs">
        <div class="route-markers">
          <div class="marker-start">起</div>
          <div class="marker-line"></div>
          <div class="marker-end">终</div>
        </div>
        <div class="route-fields">
          <div class="route-field start">我的位置</div>
          <div class="route-field end">晓霞弄<span style="margin-left: 6px;"><span style="color: #999; font-weight: 400;">|</span> <span id="distanceText" style="color: #666; font-weight: 400; font-size: 14px;">13.4km</span></span></div>
        </div>
        <div class="swap-btn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- 交通方式 -->
      <div class="transport-options">
        <div class="transport-option active" onclick="selectTransport(this)" data-type="car">
          <img src="assets/car-front.png" alt="驾车" class="transport-icon">
          <span class="time">18分钟</span>
        </div>
        <div class="transport-option" onclick="selectTransport(this)" data-type="bus">
          <img src="assets/bus-front.png" alt="公交" class="transport-icon">
          <span class="time">35分钟</span>
        </div>
        <div class="transport-option" onclick="selectTransport(this)" data-type="bike">
          <img src="assets/bike.png" alt="骑行" class="transport-icon">
          <span class="time">58分钟</span>
        </div>
        <div class="transport-option" onclick="selectTransport(this)" data-type="walk">
          <img src="assets/walk.png" alt="步行" class="transport-icon">
          <span class="time">3小时2分</span>
        </div>
      </div>

      <!-- 分割线 -->
      <div class="divider"></div>

      <!-- 底部按钮 -->
      <div class="bottom-buttons">
        <div class="collect-btn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          收藏
        </div>
        <div class="start-nav-btn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          开始导航
        </div>
      </div>
    </div>
  </div>

  <script src="assets/common.js"></script>
  <script>
    var iconMap = {
      car: { black: 'assets/car-front.png', gray: 'assets/car-front-gray.png' },
      bus: { black: 'assets/bus-front-black.png', gray: 'assets/bus-front.png' },
      bike: { black: 'assets/bike-black.png', gray: 'assets/bike.png' },
      walk: { black: 'assets/walk-black.png', gray: 'assets/walk.png' }
    };
    var distanceMap = {
      car: '13.4km',
      bus: '13.8km',
      bike: '12.6km',
      walk: '12.2km'
    };
    function selectTransport(el) {
      document.querySelectorAll('.transport-option').forEach(function(opt) {
        opt.classList.remove('active');
        var type = opt.getAttribute('data-type');
        var img = opt.querySelector('.transport-icon');
        if (type && iconMap[type] && img) {
          img.src = iconMap[type].gray;
        }
      });
      el.classList.add('active');
      var type = el.getAttribute('data-type');
      var img = el.querySelector('.transport-icon');
      if (type && iconMap[type] && img) {
        img.src = iconMap[type].black;
      }
      // 更新距离
      var distanceEl = document.getElementById('distanceText');
      if (distanceEl && distanceMap[type]) {
        distanceEl.textContent = distanceMap[type];
      }
    }
  </script>
</body>
</html>
