<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜点 - 注册</title>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
  <div class="phone">
  <div id="register" class="view">
    <!-- 头部 -->
    <div class="login-header">
      <div class="login-title">
        <h1>Hello！</h1>
        <p>欢迎来到镜点</p>
      </div>
      <img class="login-mascot" src="assets/diandian.png" alt="点点">
    </div>

    <!-- 注册卡片 -->
    <div class="login-card">
      <div class="card-title">手机号注册</div>

      <div class="input-group">
        <div class="input-wrap">
          <span class="input-prefix">+86</span>
          <input type="tel" id="reg-phone" placeholder="请输入手机号" maxlength="11">
        </div>
      </div>

      <div class="input-group">
        <div class="input-wrap">
          <input type="tel" id="reg-code" placeholder="请输入验证码" maxlength="6">
          <button class="code-btn" id="reg-code-btn">获取验证码</button>
        </div>
      </div>

      <button class="login-btn" id="reg-btn">注册</button>

      <div class="register-link">
        已有账号？<a href="javascript:void(0)" id="loginLink">去登录</a>
      </div>
    </div>

    <!-- 其他登录方式 -->
    <div class="other-login">
      <div class="line"></div>
      <span>其他登录方式</span>
      <div class="line"></div>
    </div>

    <div class="social-icons">
      <button class="social-btn" id="reg-wechat-btn" title="微信登录">
        <img src="assets/wechat.png" alt="微信">
      </button>
      <button class="social-btn" id="reg-qq-btn" title="QQ登录">
        <img src="assets/qq.png" alt="QQ">
      </button>
      <button class="social-btn" id="reg-apple-btn" title="Apple登录">
        <img src="assets/apple.png" alt="Apple">
      </button>
    </div>

    <!-- 协议 -->
    <div class="agreement">
      <input type="checkbox" id="reg-agree">
      <label for="reg-agree">
        阅读并同意<a href="javascript:void(0)" id="reg-user-agreement">《用户协议》</a>和<a href="javascript:void(0)" id="reg-privacy-policy">《隐私政策》</a>
      </label>
    </div>
  </div>

  <!-- ===== 视图：广场页 ===== -->
  <!-- 状态栏（固定顶部） -->
  <div class="status-bar status-bar-fixed">
    <span class="status-time">9:00</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1a1a1a"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.5" fill="#1a1a1a"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1a1a1a"/><rect x="15" y="0.5" width="3" height="11.5" rx="0.5" fill="#1a1a1a"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#1a1a1a"/><path d="M3.5 6.2a6.4 6.4 0 019 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M1 3.5a10 10 0 0114 0" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="#1a1a1a" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round" /><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1a1a1a"/><rect x="24" y="3.5" width="1.5" height="5" rx="0.75" fill="#1a1a1a" opacity="0.4"/></svg>
    </div>
  </div>
  </div>
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  <script src="assets/common.js"></script>
  <script>
    (function() {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      var current = document.getElementById('register');
      if (current) current.classList.add('active');
      var sb = document.querySelector('.status-bar-fixed');
      if (sb) sb.classList.add('show');
      sb.style.background = 'transparent';
    })();
  </script>
</body>
</html>
